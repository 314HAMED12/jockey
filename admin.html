<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://sbipquchrkpdbjshtduf.supabase.co wss://sbipquchrkpdbjshtduf.supabase.co; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JOCKEY | شاشة الكاشير</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/logo.jpg">
<link rel="stylesheet" href="style.css?v=7">
<style>
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-block:20px}
.col h2{font-size:20px;display:flex;gap:8px;align-items:center;margin-bottom:12px}
.col h2 b{background:var(--act);color:var(--onact);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px}
.ord{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:grid;gap:8px}
.ord.new{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oh .no{font-size:24px;font-weight:700}
.badge{font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--chip);white-space:nowrap}
.badge.car{background:#f9eeda;color:#6b4a0f}.badge.dinein{background:#e7f1fb;color:#174a7a}
.who{font-weight:600}.who small{color:var(--mute);font-weight:400}
.its{margin:0;padding:0;list-style:none;border-top:1px dashed var(--line);padding-top:8px}
.its li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.its small{color:var(--mute)}
.acts{display:flex;gap:8px}
.acts button{flex:1;border:0;border-radius:12px;padding:11px;font-weight:700}
.acts .p{background:var(--act);color:var(--onact)}.acts .s{background:var(--chip)}
.empty{color:var(--mute);border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.sound{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap}
.sound.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mem{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:#8a5520;background:#f9eeda;border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:2px}
.mem svg{width:12px;height:12px}
.pd{color:var(--accent);font-weight:700}
.paid{background:#e5f4e4;color:#1f4d14;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
dialog.set{border:0;padding:0;background:transparent;color:var(--ink);width:min(420px,calc(100vw - 32px))}
dialog.set::backdrop{background:rgba(15,9,6,.5)}
dialog.set .login{margin:0;max-width:none}
.rate{display:flex;align-items:center;gap:10px;margin-top:8px;font-weight:600}
.rate input{width:90px!important;text-align:center;font-weight:700}
@media(max-width:860px){.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="bar pad"><div class="wrap">
  <img class="logo" src="img/logo.jpg" alt="">
  <div class="brand lat">JOCKEY ♞<small>شاشة الكاشير</small></div>
  <button class="sound" id="snd" style="margin-inline-start:auto">🔔 فعّل التنبيه</button>
  <button class="sound" id="setBtn" hidden>★ النقاط</button>
  <button class="sound" id="out" hidden>خروج</button>
</div></header>

<div class="pad" id="loginBox" hidden><form class="login" id="login">
  <h2 style="font-size:24px">دخول الكاشير</h2>
  <label class="f"><span>الإيميل</span><input type="text" id="em" autocomplete="username" inputmode="email"></label>
  <label class="f"><span>كلمة المرور</span><input type="password" id="pw" autocomplete="current-password" style="font:inherit;font-size:16px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px"></label>
  <div class="err" id="lerr" hidden></div>
  <button class="go" type="submit"><span>دخول</span><span>←</span></button>
</form></div>

<main class="pad" id="app" hidden><div class="wrap">
  <p class="note" id="mode"></p>
  <div class="board">
    <div class="col"><h2>طلبات جديدة <b id="c_new">0</b></h2><div id="l_new"></div></div>
    <div class="col"><h2>قيد التحضير <b id="c_accepted">0</b></h2><div id="l_accepted"></div></div>
    <div class="col"><h2>جاهزة للتسليم <b id="c_ready">0</b></h2><div id="l_ready"></div></div>
  </div>
</div></main>

<dialog class="set" id="setDlg"><form class="login" id="setForm">
  <h2 style="font-size:22px">إعدادات النقاط</h2>
  <label class="usep" style="margin-top:14px"><span><b>النقاط شغالة</b><small>الزبون يجمع نقاط ويخصمها من طلباته</small></span><input type="checkbox" class="sw" id="sEn"></label>
  <div class="f"><span>كم نقطة يكسب الزبون؟</span><div class="rate">كل 100 ريال = <input type="text" id="sRate" inputmode="decimal"> نقاط</div></div>
  <p class="note" id="sEx"></p>
  <p class="note">النقطة = ريال. النقاط تنضاف لما تضغط "تم التسليم"، وترجع للزبون لو رفضت طلبه.</p>
  <div class="err" id="serr" hidden></div>
  <button class="go" type="submit"><span>حفظ</span><span>✓</span></button>
  <button class="ghost" type="button" id="sCancel">إلغاء</button>
</form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="config.js?v=7"></script>
<script src="menu.js?v=7"></script>
<script src="api.js?v=7"></script>
<script src="cashier.js?v=7"></script>
</body>
</html>
