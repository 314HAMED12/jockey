<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JOCKEY | شاشة الكاشير</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/logo.jpg">
<link rel="stylesheet" href="style.css">
<style>
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-block:20px}
.col h2{font-size:20px;display:flex;gap:8px;align-items:center;margin-bottom:12px}
.col h2 b{background:var(--act);color:var(--onact);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px}
.ord{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:grid;gap:8px}
.ord.new{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oh .no{font-size:24px;font-weight:700}
.badge{font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--chip);white-space:nowrap}
.badge.car{background:#f9eeda;color:#6b4a0f}.badge.dinein{background:#e7f1fb;color:#174a7a}
.who{font-weight:600}.who small{color:var(--mute);font-weight:400}
.its{margin:0;padding:0;list-style:none;border-top:1px dashed var(--line);padding-top:8px}
.its li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.its small{color:var(--mute)}
.acts{display:flex;gap:8px}
.acts button{flex:1;border:0;border-radius:12px;padding:11px;font-weight:700}
.acts .p{background:var(--act);color:var(--onact)}.acts .s{background:var(--chip)}
.empty{color:var(--mute);border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.sound{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap}
.sound.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:860px){.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="bar pad"><div class="wrap">
  <img class="logo" src="img/logo.jpg" alt="">
  <div class="brand lat">JOCKEY ♞<small>شاشة الكاشير</small></div>
  <button class="sound" id="snd" style="margin-inline-start:auto">🔔 فعّل التنبيه</button>
  <button class="sound" id="out" hidden>خروج</button>
</div></header>

<div class="pad" id="loginBox" hidden><form class="login" id="login">
  <h2 style="font-size:24px">دخول الكاشير</h2>
  <label class="f"><span>الإيميل</span><input type="text" id="em" autocomplete="username" inputmode="email"></label>
  <label class="f"><span>كلمة المرور</span><input type="password" id="pw" autocomplete="current-password" style="font:inherit;font-size:16px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px"></label>
  <div class="err" id="lerr" hidden></div>
  <button class="go" type="submit"><span>دخول</span><span>←</span></button>
</form></div>

<main class="pad" id="app" hidden><div class="wrap">
  <p class="note" id="mode"></p>
  <div class="board">
    <div class="col"><h2>طلبات جديدة <b id="c_new">0</b></h2><div id="l_new"></div></div>
    <div class="col"><h2>قيد التحضير <b id="c_accepted">0</b></h2><div id="l_accepted"></div></div>
    <div class="col"><h2>جاهزة للتسليم <b id="c_ready">0</b></h2><div id="l_ready"></div></div>
  </div>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
{
const API=window.JOCKEY_API,$=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),sar=n=>n+' ر.س';
const TYPES={pickup:'استلام',car:'سيارة',dinein:'داخل الكافيه'};
const NEXT={new:['accepted','قبول الطلب'],accepted:['ready','جاهز ✓'],ready:['done','تم التسليم']};
let seen=null,audio=null,soundOn=false;
$('#mode').textContent=API.live?'':'وضع تجربة: افتح صفحة العميل في نفس المتصفح وأرسل طلب، ويطلع هنا.';

function beep(){if(!soundOn||!audio)return;const t=audio.currentTime;[0,.25,.5].forEach((d,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=i==2?1046:880;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.3,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.2);o.connect(g).connect(audio.destination);o.start(t+d);o.stop(t+d+.22)})}
$('#snd').onclick=()=>{try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();soundOn=!soundOn;$('#snd').classList.toggle('on',soundOn);$('#snd').textContent=soundOn?'🔔 التنبيه شغّال':'🔔 فعّل التنبيه';if(soundOn)beep()}catch(e){}};

const ago=d=>{const m=Math.round((Date.now()-new Date(d))/6e4);return m<1?'الحين':m<60?`قبل ${m} د`:`قبل ${Math.floor(m/60)} س`};
function card(o){
 const n=NEXT[o.status];
 return `<div class="ord ${o.status=='new'?'new':''}"><div class="oh"><span class="no">#${o.no}</span><span class="badge ${o.order_type}">${TYPES[o.order_type]||''}</span></div>
 <div class="who">${esc(o.customer_name)} <small>${ago(o.created_at)}${o.phone?' · '+esc(o.phone):''}</small></div>
 ${o.car?`<div>🚗 <b>${esc(o.car)}</b></div>`:''}${o.table_no?`<div>طاولة <b>${esc(o.table_no)}</b></div>`:''}
 <ul class="its">${(o.items||[]).map(i=>`<li><span><b>${i.q}×</b> ${esc(i.n)} ${i.opt?`<small>(${esc(i.opt)})</small>`:''}</span><span>${sar(i.u*i.q)}</span></li>`).join('')}</ul>
 ${o.notes?`<div class="warn" style="margin:0">📝 ${esc(o.notes)}</div>`:''}
 <div class="oh"><b>المجموع ${sar(o.total)}</b><small style="color:var(--mute)">الدفع عند الاستلام</small></div>
 ${n?`<div class="acts"><button class="p" data-id="${o.id}" data-s="${n[0]}">${n[1]}</button>${o.status=='new'?`<button class="s" data-id="${o.id}" data-s="cancelled">رفض</button>`:''}</div>`:''}</div>`;
}
async function load(){
 let list=[];try{list=await API.listOrders()}catch(e){return}
 const ids=new Set(list.filter(o=>o.status=='new').map(o=>o.id));
 if(seen&&[...ids].some(id=>!seen.has(id)))beep();seen=ids;
 ['new','accepted','ready'].forEach(s=>{const l=list.filter(o=>o.status==s);if(s!='new')l.reverse();
  $('#c_'+s).textContent=l.length;$('#l_'+s).innerHTML=l.length?l.map(card).join(''):'<div class="empty">ما فيه طلبات</div>'});
 document.title=(ids.size?`(${ids.size}) `:'')+'JOCKEY | شاشة الكاشير';
}
$('#app').onclick=async e=>{const b=e.target.closest('[data-s]');if(!b)return;
 if(b.dataset.s=='cancelled'&&b.dataset.confirm!='1'){b.dataset.confirm='1';b.textContent='متأكد؟';return}
 b.disabled=true;try{await API.setStatus(b.dataset.id,b.dataset.s)}catch(e){}load()};

async function start(){$('#loginBox').hidden=true;$('#app').hidden=false;$('#out').hidden=!API.live;await load();API.subscribe(load)}
$('#login').onsubmit=async e=>{e.preventDefault();const r=await API.signIn($('#em').value.trim(),$('#pw').value);if(r.ok)start();else{$('#lerr').textContent=r.msg;$('#lerr').hidden=false}};
$('#out').onclick=async()=>{await API.signOut();location.reload()};
(async()=>{if(await API.session())start();else $('#loginBox').hidden=false})();
}
</script>
</body>
</html>
